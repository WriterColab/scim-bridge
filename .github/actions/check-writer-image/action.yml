name: Check Writer image
description: Build and validate the exact amd64 image that Writer publishes
inputs:
  version:
    description: Writer image version recorded in OCI metadata
    default: ci
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        load: true
        provenance: false
        tags: scim-bridge:writer
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ inputs.version }}
        cache-from: type=gha,scope=writer-amd64
        cache-to: type=gha,mode=max,scope=writer-amd64
    - name: Scan all image layers for secrets
      shell: bash
      run: .github/scripts/check-image-secrets.sh scim-bridge:writer
    - name: Check startup and authentication
      shell: bash
      run: .github/scripts/smoke-test-image.sh scim-bridge:writer
    - name: Check Writer Kubernetes runtime settings with PostgreSQL
      shell: bash
      run: python3 .github/scripts/smoke-test-writer-image.py scim-bridge:writer
