name: Promote Writer image to release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing dev image to promote (X.Y.Z-dev)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: writer-scim-bridge-publish
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'WriterColab/scim-bridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: ./.github/actions/setup-gcp-docker
      - name: Promote the dev digest and verify the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: node .github/scripts/writer-image.mjs promote "$VERSION"
