name: Publish Writer dev image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New Writer image version (X.Y.Z, without -dev); confirm the Kubernetes updater range first"
        required: true
        type: string

permissions:
  contents: read

# Shared with promotion so these workflows cannot race when checking tags.
concurrency:
  group: writer-scim-bridge-publish
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'WriterColab/scim-bridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      dev_tag: ${{ steps.version.outputs.dev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate image version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: node .github/scripts/writer-image.mjs version "$VERSION"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true

  publish:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: ./.github/actions/check-writer-image
        with:
          version: ${{ needs.version.outputs.dev_tag }}
      # Authenticate after building and testing: keep credentials out of the
      # build context and leave the short-lived token fresh for the push.
      - uses: ./.github/actions/setup-gcp-docker
      - name: Publish tested image without overwriting a version
        env:
          VERSION: ${{ inputs.version }}
        run: node .github/scripts/writer-image.mjs publish "$VERSION"
