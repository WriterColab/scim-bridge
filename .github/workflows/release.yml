name: Release

# One pipeline in two halves, in this order on purpose:
#
#   docker   build the multi-arch image, scan it, push it to GHCR
#   release  create the GitHub Release, only once that image exists
#
# The Release is written last so its notes can name a digest that is already
# pullable. A Release that points at an image the build failed to push is worse
# than no Release: it is an announcement a customer cannot act on.
#
# Pull requests run `docker` with push disabled — that is this repo's Dockerfile
# check, and it is deliberately the same job rather than a second one, so the
# thing PRs verify is the thing tags publish.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"
      - ".github/scripts/check-image-secrets.sh"
      - ".github/scripts/smoke-test-image.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to cut a GitHub Release for (e.g. v0.2.2). Skips the image build — use it to backfill Releases for tags whose images are already published."
        type: string
        required: false
        default: ""
      push_image:
        description: "Push the image this run builds to GHCR. Off = build and scan only (a dry run of the publish path)."
        type: boolean
        required: false
        default: false
      allow_overwrite:
        description: "Allow overwriting an image tag that already exists in GHCR. Only for repairing a broken publish."
        type: boolean
        required: false
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  docker:
    # A release-only dispatch (backfilling notes for an old tag) must not
    # rebuild and republish that tag's image: the bits people already pulled
    # would be replaced by whatever main builds today.
    if: github.repository == 'workos/scim-bridge' && (github.event_name != 'workflow_dispatch' || inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Tags publish. Pull requests never publish. A manual run publishes only
      # when someone ticks the box.
      PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Socket Firewall
        id: sfw
        uses: workos/setup-socket-firewall@195977cfa38ab4d70363af5403a106dbc54a61eb
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: ${{ github.event_name == 'pull_request' }}

      - name: Prepare Docker npm config
        env:
          SFW_ACTIVE: ${{ steps.sfw.outputs.active }}
          IS_EXTERNAL_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          npmrc="${RUNNER_TEMP}/sfw-docker-npmrc"
          if [ "$SFW_ACTIVE" = "true" ]; then
            cat "${HOME}/.npmrc" > "$npmrc"
            printf '\n%s\n' 'replace-registry-host=always' >> "$npmrc"
          elif [ "$IS_EXTERNAL_FORK" = "true" ]; then
            printf '%s\n' 'registry=https://registry.npmjs.org/' > "$npmrc"
          else
            echo "::error::Socket Firewall did not activate for a trusted Docker build."
            exit 1
          fi
          chmod 600 "$npmrc"

      # The same guard CI runs, in the publish path too. An image whose lockfile
      # resolves from WorkOS's internal proxy can only be rebuilt inside WorkOS,
      # which defeats publishing it (#45/#50). The Dockerfile runs this again
      # inside the build so a local `docker build` is held to it as well; this
      # copy just fails in seconds instead of minutes.
      - run: npm run check:registry

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest=auto attaches :latest to release tags only — never to a
          # prerelease (v1.0.0-rc.1) and never to a dispatch build.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=scim-bridge
            org.opencontainers.image.description=Reversible SCIM migration proxy for moving a self-hosted SCIM integration onto WorkOS Directory Sync
            org.opencontainers.image.licenses=MIT

      # package.json's version is not read by any code, but npm prints it on
      # every container start — `> scim-bridge@0.2.2 start` is in the logs of
      # every deployment — so a stale one tells an operator they are running
      # something they are not. Checked here, on the tag, because that is the
      # only moment the true answer exists and the only moment anyone would
      # notice: it sat at 0.1.0 through four releases.
      - name: Check package.json matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "$TAG_VERSION" ]; then
            echo "::error::package.json says $pkg, the tag says $TAG_VERSION." \
                 "Bump package.json in the release commit (see docs/releasing.md)."
            exit 1
          fi
          echo "✓ package.json and the tag both say $pkg"

      # Build for the runner's own arch and load it into the local daemon, so
      # the image can be inspected and started before anything is pushed. Every
      # layer is reused by the multi-arch build below, so this is not a second
      # build so much as the first half of one.
      - name: Build for inspection
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: scim-bridge:scan
          add-hosts: ${{ steps.sfw.outputs.active == 'true' && 'registry.npmjs.org=127.0.0.1' || '' }}
          build-args: |
            SOCKET_FIREWALL_REQUIRED=${{ steps.sfw.outputs.active }}
          secret-files: |
            npmrc=${{ runner.temp }}/sfw-docker-npmrc

      # Layer scan, not `ls` in the container: a file deleted in a later layer
      # is still in the pushed image. Runs before the push, because "we noticed
      # after publishing" is not something a registry lets you undo.
      - name: Check the image carries no secrets
        run: .github/scripts/check-image-secrets.sh scim-bridge:scan

      # Start it and drive the three routes a first-run customer touches. An
      # image that builds but does not boot fails at the worst possible moment:
      # in front of someone evaluating us.
      - name: Prove the image boots and authenticates
        run: .github/scripts/smoke-test-image.sh scim-bridge:scan

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version tag is a promise: 0.2.2 is the same bits forever.
      # Re-running this workflow on an existing tag would quietly break that for
      # everyone who pinned it. Only the exact `X.Y.Z` tag carries that promise;
      # the rolling tags — :latest, :main, and `{{major}}.{{minor}}` (e.g. :0.3,
      # which advances to the newest patch) — are meant to move, so a patch
      # release re-pushing :0.3 is correct, not a clash.
      - name: Refuse to overwrite a published version
        if: env.PUSH == 'true' && !inputs.allow_overwrite
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          clash=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            # Guard only the immutable exact-version tag; skip every moving tag.
            [ "$ref" = "${IMAGE}:${VERSION}" ] || continue
            if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
              echo "::error::$ref already exists in GHCR"
              clash=1
            fi
          done <<< "$TAGS"
          if [ "$clash" = 1 ]; then
            echo "Re-run with allow_overwrite only if you are repairing a broken publish." >&2
            exit 1
          fi
          echo "✓ the exact-version tag is not yet published"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 for the first customer's AWS hosts, arm64 for Cloudflare
          # Containers and for anyone developing on an Apple Silicon laptop.
          # Both go out under one manifest list, so `docker pull` picks the right
          # one and the README needs no per-arch instructions.
          platforms: linux/amd64,linux/arm64
          add-hosts: ${{ steps.sfw.outputs.active == 'true' && 'registry.npmjs.org=127.0.0.1' || '' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance records which workflow, commit and runner produced the
          # image; the SBOM lists what is inside it. Both ride in the manifest,
          # which is what lets a customer's scanner answer "are we exposed to
          # CVE-x" without asking us. Only the registry exporter can carry them,
          # so they are off when nothing is being pushed.
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          build-args: |
            SOCKET_FIREWALL_REQUIRED=${{ steps.sfw.outputs.active }}
          secret-files: |
            npmrc=${{ runner.temp }}/sfw-docker-npmrc

      - name: Remove Docker npm config
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/sfw-docker-npmrc"

      - name: Restore public registry after Docker installs
        if: ${{ always() && steps.sfw.outputs.active == 'true' }}
        uses: workos/setup-socket-firewall/teardown@195977cfa38ab4d70363af5403a106dbc54a61eb

      - name: Summarise
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo
            echo "- pushed: \`${PUSH}\`"
            echo "- tags: \`$(echo "$TAGS" | tr '\n' ' ')\`"
            echo "- digest: \`${DIGEST:-（not pushed）}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: docker
    if: |
      !cancelled()
      && github.repository == 'workos/scim-bridge'
      && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          [ -n "$tag" ] || tag="${GITHUB_REF#refs/tags/}"
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null \
            || { echo "::error::tag $tag does not exist"; exit 1; }
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            case "$tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
          } >> "$GITHUB_OUTPUT"

      # Notes are curated, not derived. A commit list answers "what changed in
      # the repo"; an operator deciding whether to upgrade a proxy sitting in
      # front of their identity provider needs "what changes for me, and what do
      # I have to do about it" — including the reversibility of each step, which
      # no commit subject carries. CHANGELOG.md holds that, is reviewed in the
      # PR that causes it, and goes missing loudly rather than silently.
      - name: Extract the curated notes
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            BEGIN { esc = v; gsub(/\./, "\\.", esc); head = "^## \\[" esc "\\]" }
            $0 ~ head { inside = 1; next }
            # the next version heading, or the link definitions at the bottom
            inside && (/^## \[/ || /^\[[^]]+\]: http/) { exit }
            inside { print }
          ' CHANGELOG.md > curated.md
          if ! grep -q '[^[:space:]]' curated.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Add one before tagging." >&2
            exit 1
          fi
          echo "✓ $(grep -c '[^[:space:]]' curated.md) lines of curated notes for $VERSION"

      # The generated half is the commit/PR list: real detail, wrong headline.
      # It goes under the curated section, never instead of it.
      - name: Build the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          minor="$(echo "$VERSION" | cut -d. -f1,2)"

          cp curated.md body.md
          {
            echo
            echo "## Container image"
            echo
            echo '```bash'
            if [ -n "${DIGEST:-}" ]; then
              echo "# pin this: a digest is the only reference that cannot change under you"
              echo "docker pull ${IMAGE}@${DIGEST}"
              echo
            fi
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "\`linux/amd64\` and \`linux/arm64\` under one manifest list."
            echo "\`:${minor}\` follows patch releases of ${minor}; \`:latest\` follows every release"
            echo "and is for trying it out, not for running it."
          } >> body.md

          if gen="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                      -f tag_name="$TAG" --jq .body 2> /dev/null)"; then
            { echo; echo "---"; echo; echo "$gen"; } >> body.md
          else
            echo "note: GitHub generated no commit list for $TAG; publishing curated notes only"
          fi

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --notes-file body.md
          else
            flags=(--title "$TAG" --notes-file body.md --verify-tag)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
