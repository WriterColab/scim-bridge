name: Socket Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  socket:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      security-events: write
    uses: WriterInternal/security/.github/workflows/socket.yml@cbf50b9e0e23096793113e4ff5e7f304936f61f4 # main
    secrets:
      zizmor_infisical_project_uuid: ${{ secrets.ZIZMOR_INFISICAL_PROJECT_UUID }}
