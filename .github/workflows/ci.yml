name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      skip-image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The conformance suite runs one spec against every driver, but it skips
    # Postgres unless TEST_DATABASE_URL points at a real server — a fake would
    # prove nothing about the dialect, which is the entire risk. Without this
    # service the suite passes while exercising no Postgres code, which is the
    # failure mode the type-gate check exists to kill, one layer down. The suite itself
    # refuses to skip the driver when CI is set, so a service that fails to come
    # up is a red build rather than a quietly narrower one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scimtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Setup Socket Firewall
        if: github.repository == 'workos/scim-bridge'
        uses: workos/setup-socket-firewall@195977cfa38ab4d70363af5403a106dbc54a61eb
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
          allow-external-fork-fallback: ${{ github.event_name == 'pull_request' }}
      - name: Test Writer image publishing guards
        run: node --test .github/scripts/writer-image.test.mjs
      - run: npm ci
      # Every dependency must come from the public registry: this repo is
      # published, and an internal proxy URL installs for nobody else (#45).
      - run: npm run check:registry
      - run: npm run typecheck
      # Proves the gate above can actually fail (for months it could not).
      - run: npm run typecheck:gate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/scimtest
      # The whole suite on Postgres, not only the conformance cases: those cover
      # the behaviours someone thought to write down, these cover the ones the
      # code actually relies on. This is what caught INSERT OR IGNORE.
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/scimtest
      # Neither engine may run fewer tests than the other — that is how "make it
      # pass on Postgres" turns into "don't run it on Postgres".
      - run: npm run test:engines
      - run: npm run build

  image:
    if: github.repository == 'WriterColab/scim-bridge' && !inputs.skip-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-writer-image
